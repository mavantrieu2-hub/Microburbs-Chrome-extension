<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; padding: 12px; font-family: sans-serif; margin: 0; }
    h3 { margin-top: 0; font-size: 14px; color: #1e293b; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    #result { margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Microburbs Search</h3>
  <input type="text" id="manual-address" placeholder="Nhập địa chỉ (VD: 8 Sam Sing St, Waterloo)">
  <button id="search-btn">Tra cứu ngay</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
